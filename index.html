<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen" />
    <meta name="apple-mobile-web-app-title" content="Lyareth" />
    <meta name="theme-color" content="#0a0a12" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Lyareth</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a12;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #game {
        position: fixed;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // No PWA caching while we iterate (it caused stale black screens). If an
      // old caching service worker is still installed, unregister it and drop
      // all caches so the app always loads fresh from the network.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations?.().then((rs) => {
          for (const r of rs) r.unregister();
        });
        if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k)));
      }
    </script>
  </body>
</html>
